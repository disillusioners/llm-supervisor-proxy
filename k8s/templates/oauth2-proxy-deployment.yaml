{{- include "llm-supervisor-proxy.oauth2ModeGuard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: llmproxy
spec:
{{- if ne (toString .Values.oauth2Proxy.replicas) "<nil>" }}
  replicas: {{ .Values.oauth2Proxy.replicas }}
{{- end }}
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: {{ .Values.oauth2Proxy.image.registry }}/{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}
        args:
        - --provider=oidc
        - --oidc-issuer-url={{ .Values.oauth2Proxy.issuerURL }}
        - --client-id=$(CLIENT_ID)
        - --client-secret=$(CLIENT_SECRET)
        - --cookie-secret=$(COOKIE_SECRET)
        - --upstream=file:///dev/null
        - --email-domain={{ .Values.oauth2Proxy.emailDomain }}
        - --cookie-expire={{ .Values.oauth2Proxy.cookieExpire }}
        - --skip-provider-button=true
        - --http-address=0.0.0.0:4180
        - --session-cookie-minimal=true
        envFrom:
        - secretRef:
            name: {{ .Values.oauth2Proxy.existingSecret }}
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: llmproxy
spec:
  ports:
  - port: 4180
    targetPort: 4180
  selector:
    app: oauth2-proxy
