{{- include "llm-supervisor-proxy.oauth2ModeGuard" . -}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "llm-supervisor-proxy.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $host := (index .Values.ingress.hosts 0).host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-protected
  labels:
    {{- include "llm-supervisor-proxy.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
{{- /*
Edge-in-path test (AR-22 / ADR-001 I-2): the edge gates the request path when
oauth2Proxy.enabled=true AND (the app is not enforcing OR the designed
overlap state is held). In overlap the annotations STAY; in internal-only
they drop.
*/}}
{{- if and .Values.oauth2Proxy.enabled (or (not .Values.internalOAuth2.enabled) .Values.internalOAuth2.overlap) }}
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.llmproxy.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email"
{{- end }}
    nginx.ingress.kubernetes.io/app-root: "/ui/"
    # Long-running request support for streaming LLM responses
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  tls:
    - secretName: {{ $fullName }}-tls
      hosts:
        - {{ $host }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          - path: /fe/api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
{{- end }}
