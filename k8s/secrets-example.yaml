apiVersion: v1
kind: Secret
metadata:
  name: llm-proxy-db-secret
type: Opaque
stringData:
  # Update the host and credentials with your own values
  url: "postgres://llm_proxy:YOUR_DB_PASSWORD@YOUR_DB_HOST:5432/llm_proxy?sslmode=disable"
  password: "YOUR_DB_PASSWORD"
---
# The oauth2-proxy-secret below is REUSED AS-IS by the in-binary OAuth2 mode
# (internalOAuth2.*): the app mounts CLIENT_ID / CLIENT_SECRET / COOKIE_SECRET
# via secretKeyRef from this SAME secret (internalOAuth2.existingSecret,
# default "oauth2-proxy-secret") — NO new keys, NO regeneration, NO Casdoor
# console work. The two layers encrypt DIFFERENT cookies with different
# derivations, so there is no cross-layer interference. A dedicated internal
# client later is a config-only change (new values in this same secret) and
# does NOT gate Phase 1.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: llmproxy
type: Opaque
stringData:
  CLIENT_ID: "YOUR_OAUTH2_CLIENT_ID"
  CLIENT_SECRET: "YOUR_OAUTH2_CLIENT_SECRET"
  COOKIE_SECRET: "YOUR_OAUTH2_COOKIE_SECRET"
